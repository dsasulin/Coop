version: '3.8'

# ============================================================================
# Banking ETL - Docker Compose Configuration
# ============================================================================
# Services:
# - postgres: PostgreSQL for Airflow & Hive Metastore
# - hive-metastore: Hive Metastore service
# - spark-master: Spark master node
# - spark-worker: Spark worker nodes
# - airflow-webserver: Airflow web UI
# - airflow-scheduler: Airflow scheduler

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:14-alpine
    container_name: banking_etl_postgres
    environment:
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_password
      POSTGRES_DB: metastore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - banking_etl_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "etl_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Hive Metastore
  # ==========================================================================
  hive-metastore:
    image: apache/hive:3.1.3
    container_name: banking_etl_hive_metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=etl_user
        -Djavax.jdo.option.ConnectionPassword=etl_password
    ports:
      - "9083:9083"
    volumes:
      - hive_metastore_data:/opt/hive/data/warehouse
    networks:
      - banking_etl_network
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # Spark Master
  # ==========================================================================
  spark-master:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    container_name: banking_etl_spark_master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - HIVE_METASTORE_URI=thrift://hive-metastore:9083
    ports:
      - "8080:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master Port
    volumes:
      - ./spark_jobs:/opt/spark/jobs
      - ./utils:/opt/spark/utils
      - ./Data:/opt/spark/data
      - spark_logs:/opt/spark/logs
    networks:
      - banking_etl_network
    depends_on:
      - hive-metastore

  # ==========================================================================
  # Spark Worker
  # ==========================================================================
  spark-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4g
      - HIVE_METASTORE_URI=thrift://hive-metastore:9083
    ports:
      - "8081:8081"  # Spark Worker Web UI
    volumes:
      - ./spark_jobs:/opt/spark/jobs
      - ./utils:/opt/spark/utils
      - ./Data:/opt/spark/data
      - spark_logs:/opt/spark/logs
    networks:
      - banking_etl_network
    depends_on:
      - spark-master
    deploy:
      replicas: 2

  # ==========================================================================
  # Airflow Webserver
  # ==========================================================================
  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: banking_etl_airflow_webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://etl_user:etl_password@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=your-fernet-key-here
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=your-secret-key-here
    ports:
      - "8082:8080"  # Airflow Web UI
    volumes:
      - ./airflow_dags:/opt/airflow/dags
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./utils:/opt/airflow/utils
      - airflow_logs:/opt/airflow/logs
    networks:
      - banking_etl_network
    depends_on:
      postgres:
        condition: service_healthy
    command: webserver

  # ==========================================================================
  # Airflow Scheduler
  # ==========================================================================
  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: banking_etl_airflow_scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://etl_user:etl_password@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=your-fernet-key-here
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow_dags:/opt/airflow/dags
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./utils:/opt/airflow/utils
      - airflow_logs:/opt/airflow/logs
    networks:
      - banking_etl_network
    depends_on:
      postgres:
        condition: service_healthy
    command: scheduler

# ============================================================================
# Networks
# ============================================================================
networks:
  banking_etl_network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
  hive_metastore_data:
  spark_logs:
  airflow_logs:
